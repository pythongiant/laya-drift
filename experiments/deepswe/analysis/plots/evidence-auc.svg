<text x="340.0" y="310" class="tick" text-anchor="middle">0.5</text>
<line x1="450.0" y1="60" x2="450.0" y2="296" stroke="#f3f4f6"/>
<text x="450.0" y="310" class="tick" text-anchor="middle">0.6</text>
<line x1="560.0" y1="60" x2="560.0" y2="296" stroke="#f3f4f6"/>
<text x="560.0" y="310" class="tick" text-anchor="middle">0.7</text>
<line x1="670.0" y1="60" x2="670.0" y2="296" stroke="#f3f4f6"/>
<text x="670.0" y="310" class="tick" text-anchor="middle">0.8</text>
<line x1="780.0" y1="60" x2="780.0" y2="296" stroke="#f3f4f6"/>
<text x="780.0" y="310" class="tick" text-anchor="middle">0.9</text>
<line x1="890.0" y1="60" x2="890.0" y2="296" stroke="#f3f4f6"/>
