<line x1="441.9" y1="60" x2="441.9" y2="296" stroke="#111827" stroke-dasharray="4 4"/>
<rect x="230" y="70" width="660.0" height="18" fill="#16a34a"/>
<text x="896.0" y="83" class="tick">1.000</text>
<text x="222" y="83" class="tick" text-anchor="end">test runs</text>
<rect x="230" y="100" width="660.0" height="18" fill="#16a34a"/>
<text x="896.0" y="113" class="tick">1.000</text>
<text x="222" y="113" class="tick" text-anchor="end">best passing tests</text>
<rect x="230" y="130" width="191.5" height="18" fill="#9ca3af"/>
