<svg xmlns="http://www.w3.org/2000/svg" width="980" height="240" viewBox="0 0 980 240" font-family="-apple-system, Helvetica, Arial, sans-serif">
<style>text{fill:#111827}.tick{font-size:11px;fill:#4b5563}.label{font-size:12px;fill:#374151}.title{font-size:14px;font-weight:600}.small{font-size:11px;fill:#6b7280}</style>
<text x="24" y="26" class="title">Early-warning AUC on the micro-benchmark</text>
<text x="24" y="48" class="small">0.5 = chance; feature measured over the first 80% of turns</text>
<line x1="250.0" y1="60" x2="250.0" y2="216" stroke="#f3f4f6"/>
<text x="250.0" y="230" class="tick" text-anchor="middle">0.4</text>
<line x1="356.7" y1="60" x2="356.7" y2="216" stroke="#f3f4f6"/>
<text x="356.7" y="230" class="tick" text-anchor="middle">0.5</text>
<line x1="463.3" y1="60" x2="463.3" y2="216" stroke="#f3f4f6"/>
<text x="463.3" y="230" class="tick" text-anchor="middle">0.6</text>
<line x1="570.0" y1="60" x2="570.0" y2="216" stroke="#f3f4f6"/>
<text x="570.0" y="230" class="tick" text-anchor="middle">0.7</text>
<line x1="676.7" y1="60" x2="676.7" y2="216" stroke="#f3f4f6"/>
<text x="676.7" y="230" class="tick" text-anchor="middle">0.8</text>
<line x1="783.3" y1="60" x2="783.3" y2="216" stroke="#f3f4f6"/>
<text x="783.3" y="230" class="tick" text-anchor="middle">0.9</text>
<line x1="890.0" y1="60" x2="890.0" y2="216" stroke="#f3f4f6"/>
<text x="890.0" y="230" class="tick" text-anchor="middle">1.0</text>
<rect x="250" y="70" width="640.0" height="18" fill="#16a34a"/>
<text x="896.0" y="83" class="tick">1.000</text>
<text x="242" y="83" class="tick" text-anchor="end">files touched (early)</text>
<rect x="250" y="100" width="606.7" height="18" fill="#16a34a"/>
<text x="862.7" y="113" class="tick">0.969</text>
<text x="242" y="113" class="tick" text-anchor="end">max turns without test progress</text>
<rect x="250" y="130" width="373.3" height="18" fill="#ca8a04"/>
<text x="629.3" y="143" class="tick">0.750</text>
<text x="242" y="143" class="tick" text-anchor="end">passing-test gain (early)</text>
<rect x="250" y="160" width="306.7" height="18" fill="#9ca3af"/>
<text x="562.7" y="173" class="tick">0.688</text>
<text x="242" y="173" class="tick" text-anchor="end">test runs (early)</text>
<rect x="250" y="190" width="173.3" height="18" fill="#9ca3af"/>
<text x="429.3" y="203" class="tick">0.563</text>
<text x="242" y="203" class="tick" text-anchor="end">early max drift (semantic)</text>
</svg>
